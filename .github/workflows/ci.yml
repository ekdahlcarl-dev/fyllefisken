name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm run test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Formatting
        run: |
          pnpm exec prettier --write src/app/admin/catches/actions.ts src/app/admin/competition/actions.ts src/app/admin/members/page.tsx src/lib/competition-visibility.ts
          git diff -- src/app/admin/catches/actions.ts src/app/admin/competition/actions.ts src/app/admin/members/page.tsx src/lib/competition-visibility.ts
          exit 1
      - name: Build
        run: pnpm run build
