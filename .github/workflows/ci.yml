name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm run test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Formatting
        run: pnpm run format:check
      - name: Build
        run: pnpm run build
      - name: Prepare ORBIT evidence
        if: success()
        run: |
          printf '%s\n' '{"provider":"github-actions","checks":["typecheck","lint","format"],"state":"passed"}' > orbit-l1.json
          printf '%s\n' '{"provider":"github-actions","suite":"automated-tests","state":"passed"}' > orbit-l2.json
      - name: Publish L1 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-evidence-l1-github-actions
          path: orbit-l1.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish L2 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-evidence-l2-automated-tests
          path: orbit-l2.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fyllefisken-next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
